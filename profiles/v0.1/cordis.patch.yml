- id: ds-orchestrator
  config:
    mode: direct
    worker:
      provider: openai-codex
      model: gpt-5.6-codex
      maxTokens: 32000
    budgets:
      maxWorkers: 0
      maxPluginToolActions: 24
      toolTimeoutMs: 60000
    verification:
      commands:
        - name: typecheck
          executable: pnpm
          fixedArgs: [typecheck]
          allowedArgs: none
        - name: test:profile
          executable: pnpm
          fixedArgs: [test:profile]
          allowedArgs: orchestrator-test-paths
      timeoutMs: 120000
      maxOutputBytes: 65536
